name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format --check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests (컴포넌트 동작 + a11y)
        run: pnpm test --watch=false

      - name: Build library
        run: pnpm build

      - name: Type-check docs examples
        run: pnpm docs:check

      - name: Build docs
        run: pnpm docs:build

      - name: Check docs examples (렌더링 + a11y)
        run: pnpm docs:test
